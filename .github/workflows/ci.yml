name: MARBLEX CI

on:
  push:
    branches: [ main, master, upgrades ]
  pull_request:
    branches: [ main, master, upgrades ]

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci || npm install

      - name: Run Server Tests
        run: |
          cd server
          npm test

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: Run Client Vitest Tests
        run: |
          cd client
          npm test

      - name: Build Client PWA
        run: |
          cd client
          npm run build

