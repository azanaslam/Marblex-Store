<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64">
  <title>MARBLEX</title>
  <defs>
    <clipPath id="circle-clip">
      <circle cx="32" cy="32" r="31" />
    </clipPath>
  </defs>
  <!-- High-contrast crisp circular background for dark and light browser tabs -->
  <circle cx="32" cy="32" r="31" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5" />
  <!-- MARBLEX official emblem -->
  <image href="data:image/png;base64," x="0" y="0" width="64" height="64" clip-path="url(#circle-clip)" />
