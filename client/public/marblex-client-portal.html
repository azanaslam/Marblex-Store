<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d3d4d">
<title>MARBLEX · Client Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eff3f7;--card:#fff;--ink:#0b2e3a;--mut:#64788a;--line:#e2e9ef;--field:#f5f8fb;--or:#f15b37;--or2:#ff7a4d;--sd1:#0d3d4d;--sd2:#06212b;--sh:0 10px 30px -14px rgba(7,34,44,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#071c24;--card:#0e2a35;--ink:#eaf3f7;--mut:#8fa6b3;--line:#1d4251;--field:#133441;--sh:0 10px 30px -14px rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{font-family:Inter,system-ui,sans-serif;background:var(--sd2);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,.sg,.kpi b{font-family:'Space Grotesk',Inter,sans-serif}
button{font-family:inherit;cursor:pointer}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:268px 1fr;min-height:100svh}
body.embedded #th,
body.embedded #th2,
body.embedded #bl,
body.embedded #np{display:none!important}
body.embedded .tr{gap:8px}
body.embedded .app{min-height:100%;height:100svh}
/* Embedded under the site navbar: no second brand header — slim workspace toolbar only */
body.embedded .main{border-radius:18px 0 0 18px;box-shadow:inset 1px 0 0 rgba(255,255,255,.04)}
body.embedded .brand-block{display:none!important}
body.embedded .ctx{display:block;min-width:0}
body.embedded .top{
  border-radius:18px 0 0 0;
  padding:10px 22px;
  min-height:52px;
  gap:12px;
  background:var(--bg);
  backdrop-filter:none;
  border-bottom:1px solid var(--line);
  box-shadow:none;
}
body.embedded .top .gs{height:38px;min-width:240px;max-width:340px;border-radius:11px;font-size:12.5px}
body.embedded .top .ib{width:38px;height:38px;border-radius:11px}
body.embedded .ctx small{font:700 9.5px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
body.embedded .ctx b{font:700 16px 'Space Grotesk';display:block;letter-spacing:-.01em;color:var(--ink);margin-top:1px}
body.embedded .side{top:0;height:100svh;padding:18px 14px}
body.embedded .prof{padding:2px 6px 14px;gap:10px}
body.embedded .av{width:40px;height:40px;font-size:16px}
body.embedded .sec{letter-spacing:.14em;opacity:.85;padding-top:2px}
body.embedded .sfoot .nv span{font-size:12.5px}
@media(max-width:900px){
body.embedded .main{border-radius:0}
body.embedded .top{border-radius:0;padding:10px 14px}
body.embedded .app{height:100svh}
}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100svh - env(safe-area-inset-top,0px));background:linear-gradient(180deg,var(--sd1),var(--sd2));color:#fff;display:flex;flex-direction:column;padding:22px 16px;z-index:40}
.prof{display:flex;gap:12px;align-items:center;padding:4px 8px 18px}

.prof b{display:block;font-size:14px}.prof small{color:#8fb0be;font-size:12px}
.sec{font-size:10px;letter-spacing:.18em;color:#6f93a2;font-weight:700;padding:6px 12px 10px}
.nv{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:#c4d6de;font:600 13.5px Inter;border:0;background:none;width:100%;text-align:left;transition:all .25s;margin-bottom:3px}
.nv:hover{background:rgba(255,255,255,.07);transform:translateX(3px);color:#fff}
.nv.on{background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;box-shadow:0 12px 22px -8px rgba(241,91,55,.65);transform:none}
.sfoot{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
.sfoot .nv.red{color:#ff9a7d}
.main{background:var(--bg);border-radius:30px 0 0 30px;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding:18px 32px;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);border-radius:30px 0 0 0}
.top h1{font-size:22px}.top h1 span{color:var(--or)}.top p{font-size:12.5px;color:var(--mut);margin-top:2px}
.tr{margin-left:auto;display:flex;gap:10px}
.ib{position:relative;width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;transition:all .25s}
.ib:hover{border-color:var(--or);color:var(--or);transform:translateY(-2px)}
.dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--or);color:#fff;font:700 10px Inter;display:grid;place-items:center;font-style:normal}
.mb,.ov{display:none}
.body{padding:28px 32px 56px;max-width:1280px}
.vw>*{animation:vi .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}

.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.ph h2{font-size:24px}.ph p{color:var(--mut);font-size:13.5px;margin-top:4px}
.b,.g,.t{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:13px;font:700 13px Inter;border:0;transition:all .2s;white-space:nowrap}
.b{background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;box-shadow:0 10px 20px -8px rgba(241,91,55,.65),0 2px 0 #c9441f}
.b:hover{transform:translateY(-2px);box-shadow:0 14px 26px -8px rgba(241,91,55,.75),0 3px 0 #c9441f}.b:active{transform:translateY(1px)}
.b:disabled{background:var(--line);color:var(--mut);box-shadow:none;cursor:default;transform:none}
.g{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}.g:hover{border-color:var(--or);color:var(--or);transform:translateY(-2px)}

.sm{height:36px;padding:0 14px}.rd{width:44px;height:44px;padding:0;border-radius:50%}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:32px 34px;color:#fff;background:radial-gradient(120% 140% at 100% 0,#1b7a8f 0,#0f4659 45%,#082a36 100%);box-shadow:0 26px 44px -20px rgba(8,42,54,.75);transition:transform .25s ease-out}
.hero:before,.kpi:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(320px circle at var(--mx,70%) var(--my,0),rgba(255,255,255,.14),transparent 60%)}
.hero small{font-size:11px;letter-spacing:.2em;font-weight:700;color:#9fc3d0}

.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;position:relative;z-index:2}
.hero .g{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28);color:#fff;backdrop-filter:blur(6px)}.hero .g:hover{background:rgba(255,255,255,.18);color:#fff}
.orb{position:absolute;right:70px;top:32px;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 30% 28%,#ffb08a,var(--or) 45%,#a8341a);box-shadow:0 30px 40px -10px rgba(0,0,0,.5);animation:fl 6s ease-in-out infinite}
.rg{position:absolute;border:2px solid rgba(255,255,255,.16);border-radius:50%;animation:rx 14s linear infinite}
.r1{width:190px;height:190px;right:30px;top:-12px}.r2{width:130px;height:130px;right:260px;bottom:-40px;animation-duration:10s;animation-direction:reverse}
@keyframes rx{to{transform:rotateX(360deg) rotateY(180deg)}}@keyframes fl{50%{transform:translateY(-14px)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:18px}

.kpi i{position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--or);background:color-mix(in srgb,var(--or) 12%,transparent)}
.kpi small{font-size:10.5px;letter-spacing:.14em;font-weight:700;color:var(--mut)}
.kpi b{display:block;font-size:36px;margin:8px 0 2px}.kpi span{font-size:12px;color:var(--mut)}
.g2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:18px}.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--sh)}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.ch h3{font-size:16px}.ch a{font-size:12.5px;font-weight:700;color:var(--or);cursor:pointer}
.list{display:flex;flex-direction:column;gap:12px}

.or:hover{border-color:var(--or);transform:translateY(-2px);box-shadow:var(--sh)}
.or b{font:700 15px 'Space Grotesk'}.or small{display:block;color:var(--mut);font-size:12px;margin-top:6px}.oa{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.chip{display:inline-block;margin-left:6px;font:700 11px Inter;padding:4px 10px;border-radius:20px;text-transform:capitalize;background:color-mix(in srgb,var(--c,#64788a) 16%,transparent);color:var(--c,var(--mut))}
.s-pending{--c:#d98b06}.s-processing,.s-review{--c:#2b7de9}.s-shipped{--c:#0f8aa0}.s-delivered,.s-open{--c:#16a672}
.an{background:var(--field);border-radius:14px;padding:12px 14px;margin-bottom:10px;border-left:3px solid var(--or)}.an b{font-size:13.5px}.an small{display:block;margin-top:6px;font-size:11.5px;color:var(--mut)}
.trk{display:flex;margin:6px 0 14px}.ts{flex:1;text-align:center;position:relative;font-size:11.5px;font-weight:600;color:var(--mut)}
.ts i{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 8px;border-radius:50%;background:var(--field);border:2px solid var(--line);position:relative;z-index:1;font:700 12px Inter}
.ts:not(:last-child):after{content:"";position:absolute;top:14px;left:50%;width:100%;height:2px;background:var(--line)}
.ts.done{color:var(--ink)}.ts.done i{background:var(--or);border-color:var(--or);color:#fff}.ts.done:after{background:var(--or)}
.ts.cur{color:var(--ink)}.ts.cur i{border-color:var(--or);color:var(--or);animation:pl 1.8s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(241,91,55,.5)}100%{box-shadow:0 0 0 10px rgba(241,91,55,0)}}
.info{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,#17a2d4 11%,var(--card));border:1px solid color-mix(in srgb,#17a2d4 25%,transparent);padding:13px 16px;border-radius:14px;font-size:13px}.info .ic{color:#17a2d4}
.fb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.si{position:relative}.si .ic{position:absolute;left:13px;top:13px;color:var(--mut)}
.si input,.sel{height:44px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:0 14px;font:500 13.5px Inter;color:var(--ink);outline:0;transition:.2s}

.dc{display:flex;flex-direction:column;gap:8px;transition:transform .25s ease-out}.dc h3{font-size:15.5px}.dc p{font-size:13px;color:var(--mut);line-height:1.5;flex:1}.dc .b{align-self:flex-start;margin-top:8px}
.tag{align-self:flex-start;font:700 11px Inter;padding:4px 10px;border-radius:8px;background:var(--field);color:var(--mut)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:0 0 20px;overflow-x:auto}
.tb{padding:12px 16px;font:600 13.5px Inter;color:var(--mut);border:0;background:none;position:relative;white-space:nowrap}.tb.on{color:var(--ink)}
.tb.on:after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2.5px;background:var(--or);border-radius:3px}
.chat{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--card);box-shadow:var(--sh)}
.chh{display:flex;gap:14px;align-items:center;padding:18px 20px;background:linear-gradient(120deg,rgba(241,91,55,.13),transparent 70%)}

.chh small{font-size:10px;letter-spacing:.16em;font-weight:700}.chh h3{font-size:18px}.chh p{font-size:12.5px;color:var(--mut)}
.cm{height:320px;overflow:auto;padding:18px;background:var(--field);display:flex;flex-direction:column;gap:10px}
.cm .em{margin:auto;text-align:center;color:var(--mut);font-size:12.5px}.cm .em b{display:block;color:var(--ink);font-size:14px;margin-bottom:6px}
.bu{max-width:76%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.5;animation:vi .3s both;word-break:break-word}
.bu.me{align-self:flex-end;background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;border-bottom-right-radius:4px}

.ty span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mut);animation:bn 1s infinite}.ty span:nth-child(2){animation-delay:.15s}.ty span:nth-child(3){animation-delay:.3s}
@keyframes bn{50%{transform:translateY(-5px);opacity:.5}}
.cp{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);align-items:center}
.cp input{flex:1;height:44px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);padding:0 18px;font:500 14px Inter;color:var(--ink);outline:0}.cp input:focus{border-color:var(--or)}
.sh{font-size:15px;margin:22px 0 12px}.sr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px}.sr .sh{margin:0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fl{position:relative}.fl.w{grid-column:1/-1}
.fl input,.fl select,.fl textarea{width:100%;border:1.5px solid var(--line);background:var(--field);border-radius:14px;padding:23px 14px 8px;font:500 14px Inter;color:var(--ink);outline:0;transition:.2s}
.fl textarea{min-height:92px;resize:vertical}.fl input:focus,.fl select:focus,.fl textarea:focus{border-color:var(--or);background:var(--card);box-shadow:0 0 0 4px rgba(241,91,55,.13)}

.mut{color:var(--mut);font-size:13px;line-height:1.6}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row b{font-size:14px}.row small{display:block;color:var(--mut);font-size:12px;margin-top:3px}

.sw:after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.3s;box-shadow:0 2px 5px rgba(0,0,0,.25)}.sw.on{background:#16a672}.sw.on:after{transform:translateX(21px)}
.gd{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.pin{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--or);background:color-mix(in srgb,var(--or) 12%,transparent);margin-bottom:12px}

.toast{display:flex;gap:10px;align-items:center;background:var(--sd2);color:#fff;padding:13px 18px;border-radius:14px;font:600 13px Inter;box-shadow:0 18px 36px -10px rgba(0,0,0,.5);border-left:4px solid #22c58b;animation:ti .4s cubic-bezier(.2,1.2,.4,1)}

.nv span{white-space:nowrap}.app{transition:grid-template-columns .35s cubic-bezier(.2,.8,.2,1)}

.mt small{font:700 9.5px Inter;letter-spacing:.22em;color:var(--or)}.mt b{font:700 17px 'Space Grotesk';display:block}
.ctx{display:none;min-width:0}
.ctx small{font:700 9.5px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.ctx b{font:700 17px 'Space Grotesk';display:block;letter-spacing:-.015em;color:var(--ink);margin-top:1px}
