<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d3d4d">
<title>MARBLEX · Client Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eff3f7;--card:#fff;--ink:#0b2e3a;--mut:#64788a;--line:#e2e9ef;--field:#f5f8fb;--or:#f15b37;--or2:#ff7a4d;--sd1:#0d3d4d;--sd2:#06212b;--sh:0 10px 30px -14px rgba(7,34,44,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#071c24;--card:#0e2a35;--ink:#eaf3f7;--mut:#8fa6b3;--line:#1d4251;--field:#133441;--sh:0 10px 30px -14px rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{font-family:Inter,system-ui,sans-serif;background:var(--sd2);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,.sg,.kpi b{font-family:'Space Grotesk',Inter,sans-serif}
button{font-family:inherit;cursor:pointer}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:268px 1fr;min-height:100svh}
body.embedded #th,
body.embedded #th2,
body.embedded #bl,
body.embedded #np{display:none!important}
body.embedded .tr{gap:8px}
body.embedded .app{min-height:100%;height:100svh}
/* Embedded under the site navbar: no second brand header — slim workspace toolbar only */
body.embedded .main{border-radius:18px 0 0 18px;box-shadow:inset 1px 0 0 rgba(255,255,255,.04)}
body.embedded .brand-block{display:none!important}
body.embedded .ctx{display:block;min-width:0}
body.embedded .top{
  border-radius:18px 0 0 0;
  padding:10px 22px;
  min-height:52px;
  gap:12px;
  background:var(--bg);
  backdrop-filter:none;
  border-bottom:1px solid var(--line);
  box-shadow:none;
}
body.embedded .top .gs{height:38px;min-width:240px;max-width:340px;border-radius:11px;font-size:12.5px}
body.embedded .top .ib{width:38px;height:38px;border-radius:11px}
body.embedded .ctx small{font:700 9.5px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
body.embedded .ctx b{font:700 16px 'Space Grotesk';display:block;letter-spacing:-.01em;color:var(--ink);margin-top:1px}
body.embedded .side{top:0;height:100svh;padding:18px 14px}
body.embedded .prof{padding:2px 6px 14px;gap:10px}
body.embedded .av{width:40px;height:40px;font-size:16px}
body.embedded .sec{letter-spacing:.14em;opacity:.85;padding-top:2px}
body.embedded .sfoot .nv span{font-size:12.5px}
@media(max-width:900px){
body.embedded .main{border-radius:0}
body.embedded .top{border-radius:0;padding:10px 14px}
body.embedded .app{height:100svh}
}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100svh - env(safe-area-inset-top,0px));background:linear-gradient(180deg,var(--sd1),var(--sd2));color:#fff;display:flex;flex-direction:column;padding:22px 16px;z-index:40}
.prof{display:flex;gap:12px;align-items:center;padding:4px 8px 18px}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--or),var(--or2));display:grid;place-items:center;font:700 18px 'Space Grotesk';box-shadow:0 8px 18px -6px rgba(241,91,55,.7);overflow:hidden;color:#fff}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.prof b{display:block;font-size:14px}.prof small{color:#8fb0be;font-size:12px}
.sec{font-size:10px;letter-spacing:.18em;color:#6f93a2;font-weight:700;padding:6px 12px 10px}
.nv{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:#c4d6de;font:600 13.5px Inter;border:0;background:none;width:100%;text-align:left;transition:all .25s;margin-bottom:3px}
.nv:hover{background:rgba(255,255,255,.07);transform:translateX(3px);color:#fff}
.nv.on{background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;box-shadow:0 12px 22px -8px rgba(241,91,55,.65);transform:none}
.sfoot{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
.sfoot .nv.red{color:#ff9a7d}
.main{background:var(--bg);border-radius:30px 0 0 30px;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding:18px 32px;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);border-radius:30px 0 0 0}
.top h1{font-size:22px}.top h1 span{color:var(--or)}.top p{font-size:12.5px;color:var(--mut);margin-top:2px}
.tr{margin-left:auto;display:flex;gap:10px}
.ib{position:relative;width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;transition:all .25s}
.ib:hover{border-color:var(--or);color:var(--or);transform:translateY(-2px)}
.dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--or);color:#fff;font:700 10px Inter;display:grid;place-items:center;font-style:normal}
.mb,.ov{display:none}
.body{padding:28px 32px 56px;max-width:1280px}
.vw>*{animation:vi .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes vi{from{opacity:0;transform:translateY(16px)}}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.ph h2{font-size:24px}.ph p{color:var(--mut);font-size:13.5px;margin-top:4px}
.b,.g,.t{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:13px;font:700 13px Inter;border:0;transition:all .2s;white-space:nowrap}
.b{background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;box-shadow:0 10px 20px -8px rgba(241,91,55,.65),0 2px 0 #c9441f}
.b:hover{transform:translateY(-2px);box-shadow:0 14px 26px -8px rgba(241,91,55,.75),0 3px 0 #c9441f}.b:active{transform:translateY(1px)}
.b:disabled{background:var(--line);color:var(--mut);box-shadow:none;cursor:default;transform:none}
.g{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}.g:hover{border-color:var(--or);color:var(--or);transform:translateY(-2px)}
.t{background:none;color:var(--ink);padding:0 12px;height:36px}.t:hover{color:var(--or)}
.sm{height:36px;padding:0 14px}.rd{width:44px;height:44px;padding:0;border-radius:50%}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:32px 34px;color:#fff;background:radial-gradient(120% 140% at 100% 0,#1b7a8f 0,#0f4659 45%,#082a36 100%);box-shadow:0 26px 44px -20px rgba(8,42,54,.75);transition:transform .25s ease-out}
.hero:before,.kpi:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(320px circle at var(--mx,70%) var(--my,0),rgba(255,255,255,.14),transparent 60%)}
.hero small{font-size:11px;letter-spacing:.2em;font-weight:700;color:#9fc3d0}
.hero h2{font-size:36px;margin:6px 0 4px}.hero p{color:#cfe3ea;font-size:14.5px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;position:relative;z-index:2}
.hero .g{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28);color:#fff;backdrop-filter:blur(6px)}.hero .g:hover{background:rgba(255,255,255,.18);color:#fff}
.orb{position:absolute;right:70px;top:32px;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 30% 28%,#ffb08a,var(--or) 45%,#a8341a);box-shadow:0 30px 40px -10px rgba(0,0,0,.5);animation:fl 6s ease-in-out infinite}
.rg{position:absolute;border:2px solid rgba(255,255,255,.16);border-radius:50%;animation:rx 14s linear infinite}
.r1{width:190px;height:190px;right:30px;top:-12px}.r2{width:130px;height:130px;right:260px;bottom:-40px;animation-duration:10s;animation-direction:reverse}
@keyframes rx{to{transform:rotateX(360deg) rotateY(180deg)}}@keyframes fl{50%{transform:translateY(-14px)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:18px}
.kpi{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--sh);transition:transform .25s ease-out}
.kpi:before{background:radial-gradient(260px circle at var(--mx,50%) var(--my,0),rgba(241,91,55,.1),transparent 60%)}
.kpi i{position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--or);background:color-mix(in srgb,var(--or) 12%,transparent)}
.kpi small{font-size:10.5px;letter-spacing:.14em;font-weight:700;color:var(--mut)}
.kpi b{display:block;font-size:36px;margin:8px 0 2px}.kpi span{font-size:12px;color:var(--mut)}
.g2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:18px}.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--sh)}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.ch h3{font-size:16px}.ch a{font-size:12.5px;font-weight:700;color:var(--or);cursor:pointer}
.list{display:flex;flex-direction:column;gap:12px}
.or{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:nowrap;padding:16px 18px;border:1px solid var(--line);border-radius:18px;background:var(--card);transition:border-color .25s,box-shadow .25s,transform .25s;box-shadow:0 1px 0 rgba(7,34,44,.03)}
.or:hover{border-color:color-mix(in srgb,var(--or) 45%,var(--line));transform:translateY(-2px);box-shadow:0 14px 28px -18px rgba(7,34,44,.35)}
.or-main{min-width:0;flex:1}
.or-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.or-id{font:700 15.5px/1.2 'Space Grotesk';color:var(--ink);letter-spacing:-.01em}
.or-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.or-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--field);border:1px solid var(--line);font:600 11.5px Inter;color:var(--mut);font-variant-numeric:tabular-nums}
.or-pill strong{color:var(--ink);font-weight:700}
.or b{font:700 15px 'Space Grotesk'}.or small{display:block;color:var(--mut);font-size:12px;margin-top:6px}
.oa{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;flex:none}
.oa .t{height:38px;padding:0 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:12.5px}
.oa .t:hover{border-color:color-mix(in srgb,var(--or) 40%,var(--line));color:var(--or);background:color-mix(in srgb,var(--or) 6%,var(--card))}
.oa .b.sm,.oa .b{height:38px;padding:0 14px;font-size:12.5px;min-width:108px;box-shadow:0 8px 16px -8px rgba(241,91,55,.7)}
.chip{display:inline-flex;align-items:center;margin-left:0;font:700 10.5px Inter;padding:5px 10px;border-radius:999px;text-transform:capitalize;letter-spacing:.02em;background:color-mix(in srgb,var(--c,#64788a) 14%,transparent);color:var(--c,var(--mut));border:1px solid color-mix(in srgb,var(--c,#64788a) 22%,transparent)}
.s-pending{--c:#d98b06}.s-processing,.s-review{--c:#2b7de9}.s-quoted{--c:#7c3aed}.s-shipped{--c:#0f8aa0}.s-delivered,.s-open{--c:#16a672}
.ord-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.ord-toolbar .si{flex:1 1 220px;min-width:0}.ord-toolbar .si input{width:100%}
.ord-toolbar .sel{min-width:150px;flex:0 1 170px}
.ord-toolbar .g{flex:none}
.ord-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.ord-stat{padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.ord-stat small{display:block;font:700 10px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.ord-stat b{display:block;margin-top:4px;font:800 20px 'Space Grotesk';color:var(--ink)}
.an{background:var(--field);border-radius:14px;padding:12px 14px;margin-bottom:10px;border-left:3px solid var(--or)}.an b{font-size:13.5px}.an small{display:block;margin-top:6px;font-size:11.5px;color:var(--mut)}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(241,91,55,.5)}100%{box-shadow:0 0 0 10px rgba(241,91,55,0)}}
.info{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,#17a2d4 11%,var(--card));border:1px solid color-mix(in srgb,#17a2d4 25%,transparent);padding:13px 16px;border-radius:14px;font-size:13px}.info .ic{color:#17a2d4}
.fb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.si{position:relative}.si .ic{position:absolute;left:13px;top:13px;color:var(--mut)}
.si input,.sel{height:44px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:0 14px;font:500 13.5px Inter;color:var(--ink);outline:0;transition:.2s}
.si input{padding-left:38px;width:260px}.si input:focus,.sel:focus{border-color:var(--or);box-shadow:0 0 0 4px rgba(241,91,55,.13)}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.dc{display:flex;flex-direction:column;gap:0;padding:0;overflow:hidden;transition:transform .25s ease-out,border-color .25s,box-shadow .25s;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 1px 0 rgba(7,34,44,.03)}
.dc:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--or) 40%,var(--line));box-shadow:0 16px 32px -20px rgba(7,34,44,.4)}
.dc-top{padding:16px 16px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dc-ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--sd1),#125a78);flex:none;box-shadow:0 8px 16px -10px rgba(10,61,82,.55)}
.dc-ico.t-tds{background:linear-gradient(145deg,var(--or),#d94a25)}
.dc-ico.t-manual{background:linear-gradient(145deg,#0f8aa0,#0b6e80)}
.dc-ico.t-brochure{background:linear-gradient(145deg,#2b7de9,#1d5fc0)}
.dc-ico.t-sds{background:linear-gradient(145deg,#7c3aed,#5b21b6)}
.dc-body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.dc h3{font:700 15px/1.35 'Space Grotesk';color:var(--ink);margin:0}
.dc p{font-size:12.5px;color:var(--mut);line-height:1.5;margin:0;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dc-foot{display:flex;gap:8px;padding:0 16px 16px;margin-top:auto;flex-wrap:wrap}
.dc-foot .b,.dc-foot .g,.dc-foot .t{flex:1;min-width:110px;height:40px;justify-content:center;font-size:12.5px}
.dc-foot .t{border:1.5px solid var(--line);border-radius:12px;height:40px}
.tag{align-self:flex-start;font:700 10.5px Inter;padding:5px 10px;border-radius:999px;background:var(--field);color:var(--mut);border:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
.docs-empty{grid-column:1/-1}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:0 0 20px;overflow-x:auto}
.tb{padding:12px 16px;font:600 13.5px Inter;color:var(--mut);border:0;background:none;position:relative;white-space:nowrap}.tb.on{color:var(--ink)}
.tb.on:after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2.5px;background:var(--or);border-radius:3px}
.chat{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--card);box-shadow:var(--sh)}
.chh{display:flex;gap:14px;align-items:center;padding:18px 20px;background:linear-gradient(120deg,rgba(241,91,55,.13),transparent 70%);border-bottom:1px solid var(--line)}
.chh i{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#e5484d,var(--or));color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 10px 18px -10px rgba(241,91,55,.65)}
.chh small{font-size:10px;letter-spacing:.16em;font-weight:700;color:var(--or)}.chh h3{font:700 18px 'Space Grotesk';margin:2px 0}.chh p{font-size:12.5px;color:var(--mut);line-height:1.4}
.cm{height:min(420px,52svh);overflow:auto;padding:18px;background:linear-gradient(180deg,var(--field),color-mix(in srgb,var(--field) 70%,var(--card)));display:flex;flex-direction:column;gap:10px}
.cm .em{margin:auto;text-align:center;color:var(--mut);font-size:12.5px}.cm .em b{display:block;color:var(--ink);font-size:14px;margin-bottom:6px}
.bu{max-width:78%;padding:11px 15px;border-radius:18px;font-size:13.5px;line-height:1.55;animation:vi .3s both;word-break:break-word}
.bu.me{align-self:flex-end;background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;border-bottom-right-radius:5px;box-shadow:0 8px 16px -10px rgba(241,91,55,.55)}
.bu.th{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:0 4px 12px -10px rgba(7,34,44,.35)}
.bu a{color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px}
.bu.th a{color:#0b6e80}.bu.me a{color:#fff}
.ty span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mut);animation:bn 1s infinite}.ty span:nth-child(2){animation-delay:.15s}.ty span:nth-child(3){animation-delay:.3s}
@keyframes bn{50%{transform:translateY(-5px);opacity:.5}}
.cp{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);align-items:center;background:var(--card)}
.cp input{flex:1;height:46px;border-radius:23px;border:1.5px solid var(--line);background:var(--field);padding:0 18px;font:500 14px Inter;color:var(--ink);outline:0}.cp input:focus{border-color:var(--or);background:var(--card);box-shadow:0 0 0 4px rgba(241,91,55,.12)}
.bc-list{display:flex;flex-direction:column;gap:12px}
.bc-card{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--card);box-shadow:0 1px 0 rgba(7,34,44,.03);transition:transform .2s,border-color .2s,box-shadow .2s;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.bc-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--or) 40%,var(--line));box-shadow:0 14px 28px -18px rgba(7,34,44,.35)}
.bc-ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--or),#d94a25);flex:none;box-shadow:0 8px 16px -10px rgba(241,91,55,.55)}
.bc-card b{display:block;font:700 14px/1.35 Inter;color:var(--ink)}.bc-card small{display:block;margin-top:6px;font-size:12px;color:var(--mut)}
.bc-card .t{height:38px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px}
.s-high{--c:#dc2626}.s-urgent{--c:#b91c1c}.s-normal{--c:#0f8aa0}
.sh{font-size:15px;margin:22px 0 12px}.sr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px}.sr .sh{margin:0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fl{position:relative}.fl.w{grid-column:1/-1}
.fl input,.fl select,.fl textarea{width:100%;border:1.5px solid var(--line);background:var(--field);border-radius:14px;padding:23px 14px 8px;font:500 14px Inter;color:var(--ink);outline:0;transition:.2s}
.fl textarea{min-height:92px;resize:vertical}.fl input:focus,.fl select:focus,.fl textarea:focus{border-color:var(--or);background:var(--card);box-shadow:0 0 0 4px rgba(241,91,55,.13)}
.fl label{position:absolute;left:15px;top:8px;font-size:10.5px;font-weight:600;color:var(--mut);pointer-events:none}.fl input:disabled{opacity:.6}
.mut{color:var(--mut);font-size:13px;line-height:1.6}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row b{font-size:14px}.row small{display:block;color:var(--mut);font-size:12px;margin-top:3px}

const resizeImageFile=(file,max=320,quality=.82)=>new Promise((resolve,reject)=>{
  if(!file||!file.type||!file.type.startsWith('image/'))return reject(new Error('Please choose an image file (JPG, PNG, or WebP).'));
  if(file.size>8*1024*1024)return reject(new Error('Image must be under 8 MB.'));
  const reader=new FileReader();
  reader.onerror=()=>reject(new Error('Could not read image.'));
  reader.onload=()=>{
    const img=new Image();
    img.onerror=()=>reject(new Error('Invalid image file.'));
    img.onload=()=>{
      const scale=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.max(1,Math.round(img.width*scale));
      const h=Math.max(1,Math.round(img.height*scale));
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',quality));
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
});
const syncAuthUser=(partial)=>{
  try{
    const prev=JSON.parse(localStorage.getItem('auth_user')||'{}')||{};
    const next={...prev,...partial,id:partial._id||partial.id||prev.id};
    if(JSON.stringify(prev)===JSON.stringify(next))return;
    localStorage.setItem('auth_user',JSON.stringify(next));
    window.parent.postMessage({type:'MARBLEX_AUTH_SYNC',user:next},window.location.origin);
  }catch(_){}
};
const CART_KEY='marblex_cart';
const cartUserKey=()=>{
  try{
    const u=JSON.parse(localStorage.getItem('auth_user')||'null');
    const id=u&&(u.id||u._id);
    return id?('marblex_cart_user_'+id):'';
  }catch(_){return ''}
};
const readCart=()=>{
  try{
    const parsed=JSON.parse(localStorage.getItem(CART_KEY)||'[]');
    return Array.isArray(parsed)?parsed:[];
  }catch(_){return []}
};
const writeCart=(items)=>{
  try{
    localStorage.setItem(CART_KEY,JSON.stringify(items));
    const uk=cartUserKey();
    if(uk)localStorage.setItem(uk,JSON.stringify(items));
  }catch(_){}
  try{window.parent.postMessage({type:'MARBLEX_CART_UPDATE',cart:items},window.location.origin)}catch(_){}
  return items;
};
const pushCartItems=(incoming=[])=>{
  const merged=readCart();
  incoming.forEach(inc=>{
    const id=String(inc.productId||'');
    if(!id)return;
    const idx=merged.findIndex(m=>String(m.productId||m._id)===id);
    const qty=Math.max(1,Number(inc.quantity)||1);
    if(idx>=0){
      merged[idx]={...merged[idx],quantity:(Number(merged[idx].quantity)||0)+qty,name:merged[idx].name||inc.name,price:merged[idx].price||inc.price,imageUrl:merged[idx].imageUrl||inc.imageUrl||''};
    }else{
      merged.push({productId:id,name:inc.name,price:Number(inc.price)||0,quantity:qty,imageUrl:inc.imageUrl||''});
    }
  });
  return writeCart(merged);
};
const orderLines=(o)=>(o.items||[]).map((i,idx)=>{
  const name=Array.isArray(i)?i[0]:(i.name||'Item');
  const qty=Math.max(1,Number(Array.isArray(i)?i[1]:i.quantity)||1);
  const lineAmt=Number(Array.isArray(i)?i[2]:(i.price!=null?Number(i.price)*qty:0))||0;
  const unit=qty?Math.round(lineAmt/qty):lineAmt;
  const pid=(Array.isArray(i)?null:i.productId)||('mx-'+String(name).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')+'-'+idx);
  return {productId:pid,name,price:unit,quantity:qty,imageUrl:(!Array.isArray(i)&&i.imageUrl)||'',lineAmt};
});

      btn.onclick=e=>{
        e.preventDefault();e.stopPropagation();

        draft[i].quantity=next;
        const em=m.querySelector(`[data-rqv="${i}"]`);
        const rl=m.querySelector(`[data-rl="${i}"]`);
        if(em)em.textContent=String(next);
        if(rl)rl.textContent=pk((Number(draft[i].price)||0)*next);
        const t2=totals();

        if(ru)ru.textContent=String(t2.units);
        if(rt)rt.textContent=pk(t2.amt);
      };
    });
    const add=$('#re-add');
    if(add)add.onclick=()=>{
      add.disabled=true;add.innerHTML='Adding…';
      const payload=draft.map(l=>({productId:l.productId,name:l.name,price:l.price,quantity:l.quantity,imageUrl:l.imageUrl||''}));
      const cart=pushCartItems(payload);
      toast('✓ Items from #'+o.id+' added to your cart.');
      close();

    };
  };

}

function buildDemoOrders(count=30){

  for(let i=0;i<count;i++){

    const items=[];

    for(let j=0;j<nItems;j++){

  }
  return out;
}

else{

${S.tfa?`<p class="mut" style="font-size:13px;margin-top:10px">Authenticator is active on this account. Disable below if you lose access to your phone.</p><div class="acc-actions"><button class="g" id="tfd">Disable authenticator</button></div>`
:`${!setup?`<div class="acc-actions"><button class="b" id="tfe">${I('bell')}Enable · generate QR</button></div>`
:`<div class="tfa-qr"><img src="${setup.qrDataUrl}" alt="Authenticator QR code"/><div style="flex:1;min-width:200px"><p class="mut" style="font-size:13px;margin-bottom:10px">1) Scan this QR · 2) Enter the 6-digit code from the app to confirm.</p><div class="tfa-secret">${esc(setup.secret)}</div><div class="fg" style="margin-top:12px">${F('tfc','Authenticator code','','text','w')}</div><div class="acc-actions"><button class="b" id="tfcf">${I('check')}Confirm & enable</button><button class="g sm" id="tfx">Cancel</button></div></div></div>`}`}
</div>

    const pw=$('#pw');

function go(v,keep){
S.v=v;$('#side').classList.remove('open');$('#ov').classList.remove('on');
$('#nav').innerHTML=NAV.map(n=>`<button class="nv${n[0]===v?' on':''}" data-go="${n[0]}" title="${n[2]}">${I(n[1])}<span>${n[2]}</span></button>`).join('');
$('#pgt').textContent=NAV.find(n=>n[0]===v)[2];$('#np').classList.remove('on');$('#fabw').classList.remove('on');const pb=$('#pb');pb.classList.remove('go');void pb.offsetWidth;pb.classList.add('go');
$('#bn').innerHTML=[['overview','grid','Home'],['orders','bag','Orders'],['quotes','clip','RFQ'],['support','headset','Support'],['more','menu','More']].map(n=>`<button class="${n[0]===v?'on':''}" ${n[0]==='more'?'data-a="more"':`data-go="${n[0]}"`}>${I(n[1])}${n[2]}</button>`).join('');
const w=$('#view');w.innerHTML=V[v]();[...w.children].forEach((c,i)=>c.style.setProperty('--i',keep?0:i));P[v]&&P[v]();
w.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n;if(!n){el.textContent='0';return}let i=0;const step=Math.max(1,Math.ceil(n/18));(function s(){i=Math.min(n,i+step);el.textContent=i;if(i<n)setTimeout(s,40)})()});
if(!keep)window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{
const reEl=e.target.closest('[data-re]');

const rsim=e.target.closest('[data-rsim]');

const rcp=e.target.closest('[data-rcp]');

const rfqEl=e.target.closest('[data-rfq]');

const tkopen=e.target.closest('[data-tkopen]');

const tkcp=e.target.closest('[data-tkcp]');

const t=e.target.closest('[data-go],[data-det],[data-cp],[data-a],[data-tab],[data-open],[data-del],[data-rev],[data-fa],[data-nf]');if(!t)return;const d=t.dataset;
if(d.go){if(d.t)S.t.support=d.t;go(d.go);if(d.new==='rfq')rfq()}
else if(d.nf){openNf(d.nf,d.ref,d.nid||(''+d.nf+'-'+(d.ref||'')));pushNotifs()}
else if(d.det)det(d.det);
else if(d.cp){try{navigator.clipboard.writeText('#'+d.cp)}catch(_){}toast('Order ID #'+d.cp+' copied')}
else if(d.fa){$('#fabw').classList.remove('on');({rfq,tkt,list:newList,ds:reqDs})[d.fa]()}
else if(d.a==='more')openDrawer();
else if(d.a==='shop')window.top.location.href='/';
else if(d.a==='out')modal('Sign out?','<p class="mut">You will need to sign in again to access your portal.</p>',()=>{try{localStorage.removeItem('auth_token');localStorage.removeItem('auth_user');}catch(e){}window.top.location.href='/login';},'Sign out');
else if(d.tab){S.t[S.v]=d.tab;go(S.v,1)}
else if(d.open){const doc=S.docs[+d.open];if(doc)openDoc(doc);else toast('Document not found.',1)}
else if(d.del){S.lists.splice(+d.del,1);toast('List deleted.');go('favs',1)}
else if(d.rev){S.sess.splice(+d.rev,1);toast('Session revoked.');go('account',1)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();$('#np').classList.remove('on')}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pal()}});
document.addEventListener('click',e=>{if(!e.target.closest('#np,#bl'))$('#np').classList.remove('on');if(!e.target.closest('#fabw'))$('#fabw').classList.remove('on')});
// 3D tilt
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.tilt');document.querySelectorAll('.tilt.on').forEach(x=>{if(x!==c){x.style.transform='';x.classList.remove('on')}});if(!c||e.pointerType==='touch')return;
const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.classList.add('on');c.style.transform=`perspective(900px) rotateY(${(x-.5)*7}deg) rotateX(${(.5-y)*7}deg) translateY(-3px)`;c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%')});
// shell
const openDrawer=()=>{$('#side').classList.add('open');$('#ov').classList.add('on')};$('#av2').onclick=openDrawer;$('#fab').onclick=()=>$('#fabw').classList.toggle('on');
$('#mn').onclick=()=>{const a=$('.app');a.classList.toggle('col');try{localStorage.setItem('mx_col',a.classList.contains('col')?'1':'')}catch(_){}};$('#ov').onclick=()=>{$('#side').classList.remove('open');$('#ov').classList.remove('on')};
function npDraw(){const it=unreadNotifs();
$('#np').innerHTML=`<div class="nh"><b>Notifications</b><button class="t" id="mr">Mark all read</button></div>`+(it.length?it.slice(0,8).map(n=>`<button type="button" class="ni un" data-nf="${n.action}" data-ref="${esc(n.ref||'')}" data-nid="${esc(n.id)}" style="width:100%;border:0;background:none;cursor:pointer;text-align:left"><i>${I(n.icon)}</i><div><b>${esc(n.title)}</b><small>${esc(n.time)}</small></div></button>`).join(''):'<p class="mut" style="padding:14px">All caught up.</p>')+`<button class="g" style="width:100%;margin-top:8px" data-go="notifs">Open notification center</button>`;
$('#mr').onclick=()=>{markAllNfRead(allNotifCandidates().map(x=>x.id));npDraw();pushNotifs();toast('All notifications marked as read.')}
}
const pushNotifs=()=>{syncNfBadge();const items=unreadNotifs();try{window.parent.postMessage({type:'MARBLEX_PORTAL_NOTIFY',unread:items.length,items:items.map(n=>({id:n.id,icon:n.kind==='order'?'order':n.kind==='chat'?'chat':'bell',title:n.title,time:n.time}))},window.location.origin)}catch(_){}};
$('#bl').onclick=()=>{const p=$('#np');if(p.classList.contains('on'))return p.classList.remove('on');npDraw();p.classList.add('on')};
function pal(){const items=[...NAV.map(n=>({l:n[2],h:'page',i:n[1],f:()=>go(n[0])})),{l:'New RFQ',h:'action',i:'plus',f:rfq},{l:'New ticket',h:'action',i:'plus',f:tkt},{l:'New project list',h:'action',i:'listp',f:newList},{l:'Request datasheet',h:'action',i:'mail',f:reqDs},
...S.orders.map(o=>({l:'Order #'+o.id,h:o.st,i:'bag',f:()=>det(o.id)})),...S.docs.map(d=>({l:d.title,h:d.type,i:'doc',f:()=>openDoc(d)}))];
const m=$('#modal');m.innerHTML=`<div class="mo pt"><div class="md pal"><div class="pi">${I('search')}<input id="pq" placeholder="Search pages, orders, documents, actions…" autocomplete="off"><kbd>Esc</kbd></div><div id="pr" class="prs"></div></div></div>`;
let cur=0,list=items;const draw=()=>{$('#pr').innerHTML=list.length?list.map((x,i)=>`<button class="pr${i===cur?' on':''}" data-i="${i}">${I(x.i)}<span>${esc(x.l)}</span><small>${x.h}</small></button>`).join(''):'<p class="mut" style="padding:18px">No results found.</p>';const a=$('#pr .on');a&&a.scrollIntoView({block:'nearest'})};
const run=i=>{const x=list[i];if(x){close();x.f()}},q=$('#pq');q.focus();draw();
q.oninput=()=>{const v=q.value.toLowerCase();list=items.filter(x=>x.l.toLowerCase().includes(v));cur=0;draw()};

$('#gs').onclick=$('#gs2').onclick=pal;
const th=$('#th'),th2=$('#th2'),sT=t=>{document.documentElement.dataset.theme=t;if(th)th.innerHTML=I(t==='dark'?'sun':'moon');if(th2)th2.innerHTML=I(t==='dark'?'sun':'moon')+'<span>'+(t==='dark'?'Light mode':'Dark mode')+'</span>';try{localStorage.setItem('mx_dash_theme',t);localStorage.setItem('marblex_theme',t)}catch(_){}};
let tt='light';try{tt=localStorage.getItem('marblex_theme')||localStorage.getItem('mx_dash_theme')||'light'}catch(_){}sT(tt);const togT=()=>sT(document.documentElement.dataset.theme==='dark'?'light':'dark');if(th)th.onclick=togT;if(th2)th2.onclick=togT;

let mxInited=false,mxBooted=false,mxLoading=false;

  if(mxLoading)return;
  mxLoading=true;
  try{await loadProfile();await loadSites();await loadDocs()}catch(_){}
  finally{
    mxLoading=false;
    if(view&&V[view]&&S.v!==view)go(view,1);

window.addEventListener('message',e=>{
  if(!e.data)return;
  if(e.data.type==='MARBLEX_THEME'&&e.data.theme){sT(e.data.theme);return}
  if(e.data.type==='MARBLEX_MARK_NOTIFS_READ'){markAllNfRead(allNotifCandidates().map(x=>x.id));pushNotifs();if(S.v==='notifs')go('notifs',1);return}
  if(e.data.type==='MARBLEX_PORTAL_REQUEST_UNREAD'){pushNotifs();return}
  if(e.data.type!=='MARBLEX_PORTAL_INIT')return;
  if(e.data.embedded)document.body.classList.add('embedded');
  if(e.data.theme)sT(e.data.theme);
  if(e.data.apiBase)API.base=String(e.data.apiBase).replace(/\/$/,'');
  if(e.data.token)API.token=e.data.token;
  const u=e.data.user;
  if(u){
    applyUser({
      name:u.name,company:u.company||u.co,co:u.co||u.company,email:u.email,phone:u.phone,
      industryType:u.ind||u.industryType,ind:u.ind,city:u.city,ntn:u.ntn,strn:u.strn,
      gender:u.gender,genderUi:u.gender&&String(u.gender).includes(' ')?u.gender:genderFromApi(u.gender||'prefer_not_to_say'),
      avatarUrl:u.avatarUrl||'',
    });
  }
  const v=e.data.view||pathToView(e.data.path);
  const first=!mxInited;
  mxInited=true;
  if(first)hydratePortal(v);
  else if(v&&V[v]&&S.v!==v){go(v,1);pushNotifs()}
  else pushNotifs();
});

if(window.parent===window){
  hydratePortal('overview');
}else{

  setTimeout(()=>{if(!mxInited)hydratePortal('overview')},1200);
}
